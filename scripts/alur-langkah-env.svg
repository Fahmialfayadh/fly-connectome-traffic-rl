<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 810" width="1600" height="810" font-family="DejaVu Sans, Verdana, Arial, sans-serif">
  <defs>
    <style>
      .proc  { fill:#E8F0FA; stroke:#3B72B8; stroke-width:2; }
      .dec   { fill:#FFF3D6; stroke:#D08A12; stroke-width:2; }
      .start { fill:#E3F4EA; stroke:#2E8B57; stroke-width:2; }
      .end   { fill:#FBE7E4; stroke:#C0503F; stroke-width:2; }
      .t     { font-size:15px; font-weight:700; fill:#111827; text-anchor:middle; }
      .d     { font-size:13px; fill:#374151; text-anchor:middle; }
      .edge  { fill:none; stroke:#4B5563; stroke-width:2.2; stroke-linejoin:round; }
      .lg    { font-size:12.5px; fill:#374151; }
    </style>
    <marker id="ah" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0.5 L10,5 L0,9.5 z" fill="#4B5563"/>
    </marker>
    <marker id="ah-g" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0.5 L10,5 L0,9.5 z" fill="#2E8B57"/>
    </marker>
    <marker id="ah-r" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0.5 L10,5 L0,9.5 z" fill="#C0503F"/>
    </marker>
  </defs>

  <rect width="1600" height="810" fill="#FFFFFF"/>

  <!-- ===== Garis alur (digambar dulu agar berada di belakang kotak) ===== -->
  <line class="edge" x1="380"  y1="170" x2="440"  y2="170" marker-end="url(#ah)"/>
  <line class="edge" x1="720"  y1="170" x2="780"  y2="170" marker-end="url(#ah)"/>
  <line class="edge" x1="1120" y1="170" x2="1270" y2="170" stroke="#2E8B57" marker-end="url(#ah-g)"/>
  <line class="edge" x1="950"  y1="280" x2="950"  y2="355" stroke="#C0503F" marker-end="url(#ah-r)"/>
  <line class="edge" x1="1410" y1="235" x2="1410" y2="355" stroke="#2E8B57" marker-end="url(#ah-g)"/>
  <line class="edge" x1="1090" y1="420" x2="1270" y2="420" stroke="#C0503F" marker-end="url(#ah-r)"/>
  <line class="edge" x1="1410" y1="485" x2="1410" y2="605" marker-end="url(#ah)"/>
  <line class="edge" x1="1270" y1="670" x2="1090" y2="670" marker-end="url(#ah)"/>
  <line class="edge" x1="810"  y1="670" x2="720"  y2="670" marker-end="url(#ah)"/>
  <line class="edge" x1="440"  y1="670" x2="380"  y2="670" marker-end="url(#ah)"/>
  <line class="edge" x1="240"  y1="595" x2="240"  y2="485" stroke="#2E8B57" marker-end="url(#ah-g)"/>
  <path class="edge" d="M100,670 H50 V170 H100" stroke="#6B7280" stroke-dasharray="7 5" marker-end="url(#ah)"/>

  <!-- ===== Baris 1 ===== -->
  <!-- A: Mulai Langkah -->
  <rect class="start" x="100" y="105" width="280" height="130" rx="32"/>
  <text class="t" x="240" y="145">Mulai Langkah<tspan x="240" dy="20">(Observasi 22-dim)</tspan></text>
  <text class="d" x="240" y="187.5">Antrean 8 lajur, waktu tunggu<tspan x="240" dy="18">maks, status &amp; durasi fase</tspan></text>

  <!-- B: Agen memilih fase target -->
  <rect class="proc" x="440" y="105" width="280" height="130" rx="12"/>
  <text class="t" x="580" y="165">Agen Memilih Fase<tspan x="580" dy="20">Target (0..3)</tspan></text>

  <!-- C: Safety interlock (keputusan) -->
  <polygon class="dec" points="950,60 1120,170 950,280 780,170"/>
  <text class="t" x="950" y="146">Cek Safety Interlock</text>
  <text class="d" x="950" y="168.5">Lampu GREEN,<tspan x="950" dy="18">fase berbeda, &amp;</tspan><tspan x="950" dy="18">durasi ≥ 6 langkah?</tspan></text>

  <!-- D: Masa transisi -->
  <rect class="proc" x="1270" y="105" width="280" height="130" rx="12"/>
  <text class="t" x="1410" y="155">Masuk Masa Transisi</text>
  <text class="d" x="1410" y="177.5">YELLOW (2 langkah)<tspan x="1410" dy="18">→ ALL_RED (1 langkah)</tspan></text>

  <!-- ===== Baris 2 ===== -->
  <!-- K: Episode selesai -->
  <rect class="end" x="100" y="355" width="280" height="130" rx="32"/>
  <text class="t" x="240" y="415">Episode Selesai<tspan x="240" dy="20">&amp; Reset Otomatis</tspan></text>

  <!-- Legenda -->
  <rect x="440" y="355" width="280" height="130" rx="10" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1.5"/>
  <rect class="start" x="462" y="369" width="28" height="14" rx="7" style="stroke-width:1.5"/>
  <text class="lg" x="502" y="380.5">Awal langkah</text>
  <rect class="end" x="462" y="391" width="28" height="14" rx="7" style="stroke-width:1.5"/>
  <text class="lg" x="502" y="402.5">Akhir episode</text>
  <rect class="proc" x="462" y="413" width="28" height="14" rx="3" style="stroke-width:1.5"/>
  <text class="lg" x="502" y="424.5">Proses</text>
  <polygon class="dec" points="476,434 490,442 476,450 462,442" style="stroke-width:1.5"/>
  <text class="lg" x="502" y="446.5">Keputusan</text>
  <line x1="462" y1="464" x2="490" y2="464" stroke="#6B7280" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#ah)"/>
  <text class="lg" x="502" y="468.5">Pengulangan langkah (loop)</text>

  <!-- E: Pertahankan status -->
  <rect class="proc" x="810" y="355" width="280" height="130" rx="12"/>
  <text class="t" x="950" y="415">Pertahankan Status<tspan x="950" dy="20">Sinyal Aktif</tspan></text>

  <!-- F: Pelepasan kendaraan -->
  <rect class="proc" x="1270" y="355" width="280" height="130" rx="12"/>
  <text class="t" x="1410" y="395">Pelepasan Kendaraan<tspan x="1410" dy="20">(Discharge)</tspan></text>
  <text class="d" x="1410" y="437.5">0 saat transisi; 2.5 lurus /<tspan x="1410" dy="18">2.0 belok saat GREEN</tspan></text>

  <!-- ===== Baris 3 ===== -->
  <!-- J: Langkah ke-500? (keputusan) -->
  <polygon class="dec" points="240,595 380,670 240,745 100,670"/>
  <text class="t" x="240" y="675">Langkah ke-500?</text>

  <!-- I: Hitung reward -->
  <rect class="proc" x="440" y="605" width="280" height="130" rx="12"/>
  <text class="t" x="580" y="655">Hitung Reward</text>
  <text class="d" x="580" y="677.5">Penalti: Antrean, Waktu Tunggu,<tspan x="580" dy="18">Switch, &amp; Kolisi</tspan></text>

  <!-- H: Kedatangan kendaraan baru -->
  <rect class="proc" x="810" y="605" width="280" height="130" rx="12"/>
  <text class="t" x="950" y="655">Kedatangan Kendaraan Baru</text>
  <text class="d" x="950" y="677.5">Proses Poisson sesuai<tspan x="950" dy="18">profil aktif</tspan></text>

  <!-- G: Evaluasi kolisi -->
  <rect class="proc" x="1270" y="605" width="280" height="130" rx="12"/>
  <text class="t" x="1410" y="637">Evaluasi Kolisi</text>
  <text class="d" x="1410" y="659.5">1. Box Clearance (sisa kendaraan<tspan x="1410" dy="18">di tengah simpang)</tspan><tspan x="1410" dy="18">2. Red Light Conflict (tunggu</tspan><tspan x="1410" dy="18">merah &gt; 150 detik)</tspan></text>

  <!-- ===== Label cabang ===== -->
  <!-- Ya (C -> D) -->
  <text x="1195" y="157" text-anchor="middle" font-size="14" font-weight="700" fill="#1F7A47">Ya</text>
  <text x="1195" y="191" text-anchor="middle" font-size="12" fill="#1F7A47">(Switch Diterima)</text>
  <!-- Tidak (C -> E) -->
  <text x="962" y="313" font-size="14" font-weight="700" fill="#A8402F">Tidak</text>
  <text x="962" y="329" font-size="12" fill="#A8402F">(Switch Ditolak)</text>
  <!-- Ya (J -> K) -->
  <text x="252" y="545" font-size="14" font-weight="700" fill="#1F7A47">Ya</text>
  <!-- Belum (J -> A) -->
  <rect x="19" y="409" width="62" height="24" rx="12" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.5"/>
  <text x="50" y="425" text-anchor="middle" font-size="12.5" font-weight="700" fill="#374151">Belum</text>
</svg>
